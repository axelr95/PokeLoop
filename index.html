<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>PokeLoop</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="ressource">
        <span class="ressource-icone" id="ressource-icone">💰</span>
        <span class="ressource-valeur" id="pokedollars-valeur">0</span>
      </div>
      <div class="prod-info" id="prod-info">0 /s</div>
    </header>

    <!-- Zone décorative : sprites Pokémon façon Donjon Mystère, zone de clic manuel -->
    <main class="zone-decor" id="zone-decor">
      <div class="decor-equipe" id="decor-equipe"></div>
      <button class="btn-reset" id="btn-reset" aria-label="Réinitialiser la partie">♻️</button>
      <button class="btn-debug-fond" id="btn-debug-fond" aria-label="Changer le fond (debug)">🕐</button>
      <button class="btn-debug-argent" id="btn-debug-argent" aria-label="Doubler les Pokédollars (debug)">💸</button>
    </main>

    <div class="specialisation-badge" id="specialisation-badge"></div>

    <!-- Panel du menu sélectionné : contenu changé par les onglets du bas -->
    <section class="panel-menu">
      <div class="panel-header">
        <h2 class="panel-titre" id="panel-titre">Pokémon</h2>
        <div class="pokedex-header-actions" id="pokedex-header-actions">
          <button class="btn-pokedex" id="btn-pokedex" aria-label="Pokédex">📖</button>
        </div>
        <div class="xp-header-actions" id="xp-header-actions">
          <button class="btn-xp-all" id="btn-xp-all" aria-label="Ajouter l'XP sélectionnée à toute l'équipe">ALL</button>
          <button class="btn-xp-select" id="btn-xp-select" aria-label="Choisir la quantité d'XP"></button>
        </div>
        <div class="xp-header-actions" id="boutique-header-actions" hidden>
          <button class="btn-xp-all" id="btn-boutique-buy-all" aria-label="Acheter tout ce qui est disponible">BUY ALL</button>
        </div>
      </div>

      <div class="panel-contenu" id="panel-pokemon">
        <div class="grille-equipe" id="grille-equipe"></div>
      </div>

      <div class="panel-contenu" id="panel-boutique" hidden>
        <div class="boutique-groupe">
          <h3 class="section-titre">Boutique</h3>
          <div class="icones-liste" id="shop-liste"></div>
        </div>
        <div class="boutique-groupe">
          <h3 class="section-titre">Paliers de niveau</h3>
          <div class="icones-liste" id="paliers-liste"></div>
        </div>
        <div class="boutique-groupe">
          <h3 class="section-titre">Possédées</h3>
          <div class="icones-liste" id="possedees-liste"></div>
        </div>
      </div>
    </section>

    <!-- Onglets du bas : change le panel affiché au-dessus -->
    <nav class="tabs-bar">
      <button class="tab-btn actif" id="tab-pokemon" data-tab="pokemon" aria-label="Pokémon">🐾</button>
      <button class="tab-btn" id="tab-boutique" data-tab="boutique" aria-label="Boutique">🛒</button>
    </nav>
  </div>

  <div class="popup-backdrop" id="xp-slider-backdrop" hidden></div>
  <div class="xp-slider" id="xp-slider" hidden>
    <button class="xp-slider-choix" data-valeur="1">+1</button>
    <button class="xp-slider-choix" data-valeur="10">+10</button>
    <button class="xp-slider-choix" data-valeur="100">+100</button>
    <button class="xp-slider-choix" data-valeur="1000">+1000</button>
    <button class="xp-slider-choix" data-valeur="max">MAX</button>
  </div>

  <div class="popup-backdrop" id="popup-backdrop" hidden></div>
  <div class="popup-upgrade" id="popup-upgrade" hidden>
    <div class="popup-titre" id="popup-titre"></div>
    <div class="popup-description" id="popup-description"></div>
    <div class="popup-footer" id="popup-footer"></div>
  </div>

  <div class="popup-backdrop" id="starter-backdrop" hidden></div>
  <div class="modal-starter" id="modal-starter" hidden>
    <h3 class="modal-titre">Choisis ton Pokémon de départ</h3>
    <div class="starter-cartes" id="starter-cartes"></div>
  </div>

  <div class="popup-backdrop" id="recrue-backdrop" hidden></div>
  <div class="modal-starter" id="modal-recrue" hidden>
    <h3 class="modal-titre" id="recrue-titre"></h3>
    <div class="starter-cartes" id="recrue-cartes"></div>
  </div>

  <div class="popup-backdrop" id="pokedex-backdrop" hidden></div>
  <div class="modal-starter modal-pokedex" id="modal-pokedex" hidden>
    <div id="pokedex-vue-grille">
      <h3 class="modal-titre">Pokédex</h3>
      <p class="pokedex-compteur" id="pokedex-compteur"></p>
      <div class="pokedex-grille" id="pokedex-grille"></div>
    </div>
    <div id="pokedex-vue-fiche" hidden>
      <button class="btn-pokedex-retour" id="btn-pokedex-retour" aria-label="Retour au Pokédex">← Retour</button>
      <div class="pokedex-fiche">
        <img class="pokedex-fiche-portrait" id="pokedex-fiche-portrait" alt="" />
        <div class="pokedex-fiche-nom" id="pokedex-fiche-nom"></div>
        <div class="pokedex-fiche-types" id="pokedex-fiche-types"></div>
      </div>
      <div class="pokedex-fiche-lignee" id="pokedex-fiche-lignee"></div>
      <p class="pokedex-fiche-description" id="pokedex-fiche-description"></p>
    </div>
  </div>

  <div class="popup-backdrop" id="specialisation-backdrop" hidden></div>
  <div class="modal-starter" id="modal-specialisation" hidden>
    <h3 class="modal-titre">Choisis ta spécialisation (définitif pour cette run)</h3>
    <div class="type-cartes" id="specialisation-cartes"></div>
  </div>

  <div class="popup-backdrop" id="toast-backdrop" hidden></div>
  <div class="toast-hors-ligne" id="toast-hors-ligne" hidden>
    <p class="toast-titre">Pendant ton absence…</p>
    <p class="toast-texte" id="toast-hors-ligne-texte"></p>
    <button class="btn-acheter" id="toast-hors-ligne-fermer">Récupérer</button>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
